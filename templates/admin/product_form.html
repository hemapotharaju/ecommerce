{% extends "base.html" %}{% block title %}{% if p %}Edit{% else %}Add{% endif %} Product{% endblock %}{% block content %}
<div class="auth wide"><h2>{% if p %}Edit{% else %}Add{% endif %} Product</h2>
<form method="post">
<label>Name</label><input name="name" required value="{{ p.name if p }}">
<label>Description</label><textarea name="description">{{ p.description if p }}</textarea>
<div class="two"><div><label>Price (₹)</label><input name="price" type="number" step="0.01" required value="{{ p.price if p }}"></div>
<div><label>MRP (₹)</label><input name="mrp" type="number" step="0.01" value="{{ p.mrp if p }}"></div></div>
<div class="two"><div><label>Category</label><select name="category">{% for c in categories %}<option {% if p and p.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div>
<div><label>Stock</label><input name="stock" type="number" value="{{ p.stock if p else 50 }}"></div></div>
<label>Image URL</label><input name="image_url" value="{{ p.image_url if p }}" placeholder="https://...">
<div class="two"><div><label>Rating</label><input name="rating" type="number" step="0.1" min="1" max="5" value="{{ p.rating if p else 4.0 }}"></div>
<div><label class="pay"><input type="checkbox" name="is_offer" {% if p and p.is_offer %}checked{% endif %}> Mark as Offer</label></div></div>
<button class="btn dark full">Save Product</button></form></div>
{% endblock %}
